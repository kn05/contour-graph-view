name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Verify release versions
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Publish matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              main.js manifest.json styles.css \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes
          fi
